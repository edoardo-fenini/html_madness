<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Particle Atelier</title>
<style>
  :root { --bg:#05060a; --ink:#e9ecf3; --dim:#8d94a6; --line:rgba(255,255,255,.09); --panel:rgba(12,14,20,.72); --accent:#ffc46b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  #panel { position:fixed; top:16px; left:16px; width:248px; max-height:calc(100% - 32px); overflow:auto; padding:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  h1 { margin:0 0 2px; font-size:14px; font-weight:650; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:11.5px; margin-bottom:12px; font-variant-numeric:tabular-nums; }
  .lbl { color:var(--dim); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; margin:12px 0 6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button, select { font:inherit; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-radius:8px; padding:6px 9px; cursor:pointer; }
  button:hover, select:hover { background:rgba(255,255,255,.11); }
  button.on { background:var(--accent); color:#1a1205; border-color:transparent; font-weight:600; }
  .seg button { flex:1; white-space:nowrap; }
  .wide { width:100%; }
  label.chk { display:flex; align-items:center; gap:7px; cursor:pointer; flex:1 1 45%; }
  input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  input[type=color] { width:30px; height:24px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  .kv { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .kv span { color:var(--dim); width:62px; flex:none; }
  #hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); color:var(--dim); font-size:11.5px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; white-space:nowrap;
    max-width:calc(100% - 24px); overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  #hint b { color:var(--ink); font-weight:600; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; white-space:pre-wrap; }
  #fold { position:absolute; top:10px; right:10px; padding:2px 8px; }
  #panel.min > :not(h1):not(#fold):not(.sub) { display:none; }
  @media (max-width:560px){ #panel{ width:212px; top:10px; left:10px; padding:11px; } #hint{ font-size:10.5px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <button id="fold" title="Collapse">–</button>
  <h1>Particle Atelier</h1>
  <div class="sub" id="stats">starting…</div>

  <div class="lbl">Object</div>
  <div class="row seg">
    <button data-obj="bulb">Lightbulb</button>
    <button data-obj="watch">Watch</button>
    <button data-obj="ingot">Gold ingot</button>
  </div>

  <div class="lbl" id="actLbl">Lightbulb</div>
  <div id="act-bulb">
    <button class="wide" id="bulbBtn">Switch on</button>
    <div class="kv"><span>Dimmer</span><input type="range" id="dimmer" min="0.08" max="1" step="0.01" value="1"></div>
  </div>
  <div id="act-watch" hidden>
    <div class="row seg"><button id="lumeBtn">Lume</button><button id="syncBtn">Sync time</button></div>
    <div class="kv"><span>Crown</span>
      <select id="warp" style="flex:1"><option value="1">Real time</option><option value="60">Wind ×60</option><option value="1800">Wind ×1800</option><option value="-600">Rewind ×600</option></select></div>
    <div class="sub" id="clock" style="margin:6px 0 0"></div>
  </div>
  <div id="act-ingot" hidden>
    <button class="wide" id="meltBtn">Melt it</button>
  </div>

  <div class="lbl">Light</div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="studio" checked>Studio lights</label>
    <label class="chk"><input type="checkbox" id="photons" checked>Photons</label>
    <label class="chk"><input type="checkbox" id="orbit" checked>Orbit key light</label>
  </div>
  <div class="kv"><span>Key angle</span><input type="range" id="langle" min="0" max="6.283" step="0.01" value="0.9"></div>
  <div class="kv"><span>Key colour</span><input type="color" id="lcol" value="#fff1dc"></div>

  <div class="lbl">Particles</div>
  <div class="row">
    <select id="tier" style="flex:1"></select>
    <label class="chk" style="flex:none"><input type="checkbox" id="auto" checked>Auto</label>
  </div>
</div>

<div id="hint"><b>Drag</b> rotate · <b>Shift/right-drag</b> move · <b>Scroll</b> zoom · <b>Alt-drag</b> orbit camera · <b>Click object</b> use it</div>
<div id="err"></div>

<script>
'use strict';
/* ============================================================================
   Particle Atelier
   Everything on screen is a GL point. Nothing is a triangle mesh.
   - Object particles are born on the GPU: a transform-feedback pass scatters
     random points and projects them onto a signed distance field (SDF).
   - Every particle ray-traces its own lighting each frame in the vertex
     shader: soft shadow rays to each light and (for metals) a reflection ray,
     sphere-traced against the same SDF.
   - Floor particles trace shadow + mirror rays against the object.
   - Photon particles are light itself: each one is a ray traced from a lamp,
     bounced once off whatever it hits, and animated along that path.
   ========================================================================== */

const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, depth:false, powerPreference:'high-performance' });
function fail(msg){ const e=document.getElementById('err'); e.style.display='flex'; e.textContent=msg; document.getElementById('panel').style.display='none'; throw new Error(msg); }
if(!gl) fail('This page needs WebGL2.\nTry a current version of Chrome, Safari or Firefox.');

/* ------------------------------ GLSL: shared ------------------------------ */
const HEAD = `#version 300 es
precision highp float; precision highp int;
`;

const SDF = `
uniform int uShapeA, uShapeB, uZero;
uniform float uMorph;
uniform vec3 uHands;

uint gSeed;
uint pcg(uint v){ uint s=v*747796405u+2891336453u; uint w=((s>>((s>>28u)+4u))^s)*277803737u; return (w>>22u)^w; }
float rnd(){ gSeed=pcg(gSeed); return float(gSeed>>8u)*(1.0/16777216.0); }
vec3 rndUnit(){ float z=rnd()*2.-1.; float a=rnd()*6.2831853; float r=sqrt(max(1.-z*z,0.)); return vec3(r*cos(a),r*sin(a),z); }

float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float smax(float a,float b,float k){ return -smin(-a,-b,k); }
vec2 opU(vec2 a,vec2 b){ return a.x<b.x?a:b; }
vec2 rot2(vec2 p,float a){ float c=cos(a),s=sin(a); return vec2(c*p.x-s*p.y,s*p.x+c*p.y); }
float sdBox(vec3 p,vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){ vec3 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdCyl(vec2 radial,float axial,float r,float h){ vec2 d=abs(vec2(length(radial),axial))-vec2(r,h); return min(max(d.x,d.y),0.)+length(max(d,0.)); }

/* materials: 1 glass, 2 steel, 3 black ceramic, 4 emitter, 5 gold, 6 dial,
   7 leather, 10/11/12 hour/minute/second hand, 13 stamped gold */

vec2 sdBulb(vec3 p, bool opq){
  vec2 res=vec2(1e5,0.);
  float rxz=length(p.xz);
  float a=atan(p.z,p.x);
  float base=max(rxz-(0.255+0.012*sin(p.y*44.+a)), abs(p.y+0.56)-0.2)*0.75;
  float collar=sdCyl(p.xz,p.y+0.345,0.272,0.028)-0.01;
  res=opU(res,vec2(min(base,collar),2.));
  vec3 e=(p-vec3(0.,-0.76,0.))/vec3(0.24,0.13,0.24);
  float ins=max((length(e)-1.)*0.13, p.y+0.76);
  res=opU(res,vec2(ins,3.));
  res=opU(res,vec2(sdCyl(p.xz,p.y+0.895,0.085,0.02)-0.01,2.));
  // tungsten coil
  vec3 q=p-vec3(0.,0.42,0.);
  float f=q.x/0.026-atan(q.y,q.z)/6.2831853;
  float dx=(f-round(f))*0.026;
  float fil=max(length(vec2(length(q.yz)-0.035,dx))-0.007, abs(q.x)-0.155)*0.8;
  res=opU(res,vec2(fil,4.));
  float w=min(sdCapsule(p,vec3(.155,.42,0.),vec3(.06,.02,0.),.006), sdCapsule(p,vec3(-.155,.42,0.),vec3(-.06,.02,0.),.006));
  res=opU(res,vec2(w,2.));
  if(!opq){
    float g=length(p-vec3(0.,.42,0.))-.62;
    g=smin(g, sdCapsule(p,vec3(0.,-.02,0.),vec3(0.,-.32,0.),.262), .22);
    g=max(abs(g)-0.004, -(p.y+0.33));
    float stem=smin(sdCapsule(p,vec3(0.,-.32,0.),vec3(0.,.0,0.),.05), sdCapsule(p,vec3(-.07,.02,0.),vec3(.07,.02,0.),.022), .04);
    res=opU(res,vec2(min(g,stem),1.));
  }
  return res;
}

vec2 sdWatch(vec3 p, bool opq){
  vec2 res=vec2(1e5,0.);
  float cas=sdCyl(p.xy,p.z,0.60,0.09)-0.02;
  cas=max(cas,-sdCyl(p.xy,p.z-0.15,0.55,0.1));
  // lugs
  vec3 ql=vec3(abs(p.x)-0.27,abs(p.y)-0.62,p.z+0.01);
  cas=min(cas,sdBox(ql,vec3(0.03,0.075,0.06))-0.012);
  // crown
  float ca=atan(p.y,p.z);
  cas=min(cas,sdCyl(p.yz,p.x-0.68,0.055+0.004*sin(ca*24.),0.045)*0.8);
  res=opU(res,vec2(cas,2.));
  res=opU(res,vec2(length(vec2(length(p.xy)-0.59,p.z-0.115))-0.045,5.));     // gold bezel
  res=opU(res,vec2(sdCyl(p.xy,p.z-0.052,0.552,0.006),6.));                   // dial
  // hour markers (12-fold) and minute ticks (60-fold)
  float an=atan(p.x,p.y);
  float s12=round(an/0.5235988)*0.5235988;
  vec2 q=rot2(p.xy,s12);
  res=opU(res,vec2(sdBox(vec3(q.x,q.y-0.45,p.z-0.066),vec3(0.016,0.055,0.008))-0.003,4.));
  float s60=round(an/0.10471976)*0.10471976;
  q=rot2(p.xy,s60);
  res=opU(res,vec2(sdBox(vec3(q.x,q.y-0.515,p.z-0.06),vec3(0.004,0.016,0.004)),2.));
  // hands
  vec2 h=rot2(p.xy,uHands.x);
  res=opU(res,vec2(sdBox(vec3(h.x,h.y-0.13,p.z-0.078),vec3(0.022,0.17,0.005))-0.003,10.));
  h=rot2(p.xy,uHands.y);
  res=opU(res,vec2(sdBox(vec3(h.x,h.y-0.20,p.z-0.091),vec3(0.015,0.25,0.004))-0.003,11.));
  h=rot2(p.xy,uHands.z);
  float sh=min(sdBox(vec3(h.x,h.y-0.17,p.z-0.104),vec3(0.005,0.31,0.003)), sdCyl(vec2(h.x,h.y+0.1),p.z-0.104,0.022,0.003));
  res=opU(res,vec2(sh,12.));
  res=opU(res,vec2(sdCyl(p.xy,p.z-0.09,0.03,0.02),2.));
  // strap, curving away behind the case
  float ay=abs(p.y);
  float bend=0.42*pow(max(ay-0.6,0.),2.);
  float strap=(sdBox(vec3(p.x,ay-0.9,p.z+0.02+bend),vec3(0.235,0.32,0.022))-0.012)*0.7;
  res=opU(res,vec2(strap,7.));
  if(!opq) res=opU(res,vec2(sdCyl(p.xy,p.z-0.122,0.555,0.004),1.));         // crystal
  return res;
}

vec2 sdIngot(vec3 p){
  vec2 nx=normalize(vec2(0.42,0.15)), nz=normalize(vec2(0.42,0.14));
  float dx=dot(vec2(abs(p.x),p.y),nx)-dot(vec2(0.95,-0.21),nx);
  float dz=dot(vec2(abs(p.z),p.y),nz)-dot(vec2(0.50,-0.21),nz);
  float d=smax(smax(dx,dz,0.035),abs(p.y)-0.21,0.03);
  return vec2(d,5.);
}

vec2 sdPuddle(vec3 p){
  float th=atan(p.z,p.x);
  float R=1.0+0.13*sin(3.*th+1.)+0.08*sin(5.*th+2.5)+0.04*sin(9.*th);
  float d=length(vec2(max(length(p.xz)-R,0.),p.y+0.165))-0.06;
  return vec2(d*0.7,5.);
}

vec2 mapShape(int s, vec3 p, bool opq){
  if(s==0) return sdBulb(p,opq);
  if(s==1) return sdWatch(p,opq);
  if(s==2) return sdIngot(p);
  return sdPuddle(p);
}
vec2 map(vec3 p, bool opq){
  if(uMorph<=0.) return mapShape(uShapeA,p,opq);
  vec2 a=mapShape(uShapeA,p,opq), b=mapShape(uShapeB,p,opq);
  return vec2(mix(a.x,b.x,uMorph), uMorph<.5?a.y:b.y);
}
`;

const LIGHT = `
uniform vec3 uCam;            // camera, object-local space
uniform vec3 uLPos[3];        // lights, object-local space (0 key, 1 fill, 2 the object's own)
uniform vec3 uLCol[3];
uniform float uLRad[3];
uniform vec4 uFloor;          // floor plane in object-local space
uniform mat3 uRot; uniform vec3 uPos;
uniform float uEnvI, uBR, uTime, uHeat;
uniform vec3 uBC, uEmit;
uniform vec4 uEmitAlb;

void matProps(float m, out vec3 alb, out float metal, out float rough, out vec3 emis){
  alb=vec3(.5); metal=0.; rough=.5; emis=vec3(0.);
  vec3 heat=uHeat*uHeat*vec3(1.,.25,.03)*1.6+pow(uHeat,6.)*vec3(.5,.2,.03);
  if(m<1.5){ alb=vec3(.9); rough=.07; }
  else if(m<2.5){ alb=vec3(.78,.79,.81); metal=1.; rough=.22; }
  else if(m<3.5){ alb=vec3(.025); rough=.35; }
  else if(m<4.5){ alb=uEmitAlb.rgb; metal=uEmitAlb.a; rough=.45; emis=uEmit; }
  else if(m<5.5){ alb=vec3(1.,.68,.23); metal=1.; rough=.16; emis=heat; }
  else if(m<6.5){ alb=vec3(.015,.04,.11); rough=.25; }
  else if(m<7.5){ alb=vec3(.16,.075,.035); rough=.75; }
  else if(m<11.5){ alb=vec3(.85,.86,.88); metal=1.; rough=.2; emis=uEmit*.8; }
  else if(m<12.5){ alb=vec3(.85,.05,.03); rough=.35; }
  else { alb=vec3(.5,.33,.1); metal=1.; rough=.5; emis=heat*.7; }
}

vec3 calcN(vec3 p){
  vec3 n=vec3(0.);
  for(int i=min(0,uZero);i<4;i++){
    vec3 e=0.5773*(2.*vec3(float(((i+3)>>1)&1),float((i>>1)&1),float(i&1))-1.);
    n+=e*map(p+0.0015*e,true).x;
  }
  return normalize(n);
}
bool boundHit(vec3 ro, vec3 rd, out float t0, out float t1){
  vec3 oc=ro-uBC; float b=dot(oc,rd); float h=b*b-(dot(oc,oc)-uBR*uBR);
  t0=0.; t1=0.;
  if(h<0.) return false;
  h=sqrt(h); t0=max(-b-h,0.); t1=-b+h;
  return t1>0.;
}
float shadow(vec3 ro, vec3 rd, float tmax){
  float t0,t1; if(tmax<=0. || !boundHit(ro,rd,t0,t1)) return 1.;
  t1=min(t1,tmax); float t=t0, res=1.;
  for(int i=min(0,uZero);i<28;i++){
    if(t>=t1) break;
    float h=map(ro+rd*t,true).x;
    if(h<0.001) return 0.;
    res=min(res,9.*h/max(t,0.06));
    t+=clamp(h,0.012,0.35);
  }
  res=clamp(res,0.,1.); return res*res*(3.-2.*res);
}
float trace(vec3 ro, vec3 rd, int steps){
  float t0,t1; if(!boundHit(ro,rd,t0,t1)) return -1.;
  float t=t0;
  for(int i=min(0,uZero);i<steps;i++){
    if(t>t1) return -1.;
    float h=map(ro+rd*t,true).x;
    if(h<0.0015*(1.+t)) return t;
    t+=h;
  }
  return -1.;
}
vec3 env(vec3 rdL){
  vec3 d=uRot*rdL;
  vec3 c=mix(vec3(.04,.045,.06),vec3(.16,.18,.23),smoothstep(-.2,1.,d.y));
  if(d.y>0.05){ vec2 uv=d.xz/d.y; c+=vec3(2.6,2.5,2.35)*smoothstep(2.5,1.5,abs(uv.x-.2))*smoothstep(1.9,1.1,abs(uv.y+.1)); }
  float az=atan(d.z,d.x);
  c+=vec3(3.,3.3,3.8)*smoothstep(.14,.09,abs(az-2.4))*smoothstep(.75,.6,abs(d.y-.25));
  c+=vec3(4.,3.,2.)*smoothstep(.22,.15,abs(az+.9))*smoothstep(.5,.4,abs(d.y-.1));
  return c*uEnvI;
}
vec3 envDiff(vec3 nL){ vec3 d=uRot*nL; return mix(vec3(.03,.03,.04),vec3(.22,.24,.28),d.y*.5+.5)*uEnvI; }
vec3 floorAlb(vec2 xz){
  float r=length(xz);
  float ring=smoothstep(.465,.49,abs(fract(r)-.5));
  vec2 g=abs(fract(xz*2.)-.5);
  float grid=smoothstep(.47,.5,max(g.x,g.y));
  return vec3(.085,.09,.10)*(1.+.9*ring+.35*grid);
}
vec3 brdf(vec3 n, vec3 v, vec3 l, vec3 alb, float metal, float rough){
  vec3 h=normalize(v+l);
  float ndl=max(dot(n,l),0.), ndv=max(dot(n,v),1e-3), ndh=max(dot(n,h),0.), vdh=max(dot(v,h),0.);
  float a=rough*rough, a2=a*a; float dd=ndh*ndh*(a2-1.)+1.;
  float D=a2/(3.14159*dd*dd+1e-6);
  float k=(rough+1.); k=k*k/8.;
  float G=ndl/(ndl*(1.-k)+k)*ndv/(ndv*(1.-k)+k);
  vec3 F0=mix(vec3(.04),alb,metal);
  vec3 F=F0+(1.-F0)*pow(1.-vdh,5.);
  vec3 spec=min(D*G*F/(4.*ndl*ndv+1e-4),vec3(40.));
  return ((1.-metal)*alb/3.14159*(1.-F)+spec)*ndl;
}
vec3 floorCol(vec3 pl){
  vec3 pw=uRot*pl+uPos;
  vec3 alb=floorAlb(pw.xz), c=alb*envDiff(uFloor.xyz);
  for(int i=min(0,uZero);i<3;i++){
    vec3 L=uLPos[i]-pl; float d2=dot(L,L);
    c+=alb*uLCol[i]*max(dot(uFloor.xyz,L)*inversesqrt(d2),0.)/(d2*3.14159);
  }
  return c*smoothstep(6.5,2.,length(pw.xz));
}
vec3 shadeHit(vec3 hp, vec3 rd){
  vec3 n=calcN(hp); vec3 alb,emis; float metal,rough;
  matProps(map(hp,true).y,alb,metal,rough,emis);
  vec3 c=emis;
  for(int i=min(0,uZero);i<3;i++){
    vec3 L=uLPos[i]-hp; float d2=dot(L,L);
    c+=alb*mix(1.,.35,metal)*uLCol[i]*max(dot(n,L)*inversesqrt(d2),0.)/(d2*3.14159);
  }
  c+=metal>.5 ? alb*env(reflect(rd,n)) : alb*envDiff(n);
  return c;
}
vec3 rayColor(vec3 ro, vec3 rd){
  float t=trace(ro,rd,40);
  if(t>0.) return shadeHit(ro+rd*t,rd);
  float dn=dot(uFloor.xyz,rd);
  if(dn<-1e-4){ float tf=-(dot(uFloor.xyz,ro)+uFloor.w)/dn; if(tf>0.) return floorCol(ro+rd*tf); }
  return env(rd);
}
`;

const FRAG = HEAD + `
in vec3 vCol; in float vSoft;
uniform int uLDR;
out vec4 o;
void main(){
  vec2 c=gl_PointCoord-.5; float r2=dot(c,c);
  if(r2>.25) discard;
  float a=vSoft>0. ? pow(1.-r2*4.,vSoft) : 1.;
  vec3 col=vCol*a;
  if(uLDR==1){ col=col/(1.+col); col=pow(col,vec3(1./2.2)); }
  o=vec4(col,1.);
}`;

/* --------------------- birth of particles (transform feedback) ------------ */
const GEN_VS = HEAD + SDF + `
uniform int uGenShape; uniform uint uSeed;
uniform vec3 uBMin, uBMax; uniform float uEps;
uniform sampler2D uStamp;
out vec4 vPos; out vec4 vNrm;
vec3 genN(vec3 p){
  vec3 n=vec3(0.);
  for(int i=min(0,uZero);i<4;i++){
    vec3 e=0.5773*(2.*vec3(float(((i+3)>>1)&1),float((i>>1)&1),float(i&1))-1.);
    n+=e*mapShape(uGenShape,p+0.0015*e,false).x;
  }
  return normalize(n+1e-9);
}
void main(){
  gSeed=uint(gl_VertexID)*2654435761u+uSeed;
  vec3 p=vec3(0.), ext=uBMax-uBMin; float d=1e5;
  for(int i=min(0,uZero);i<56;i++){

  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,null);
  gl.disable(gl.RASTERIZER_DISCARD);
}
function morphTo(shapeId, dur, swirl, stag){
  if(S.morph>0){ if(S.morph>=.5){ S.ai=1-S.ai; S.shapeA=S.shapeB; } S.morph=0; }
  generate(bufs[1-S.ai],shapeId);
  S.shapeB=shapeId; S.morphing=true; S.morphDur=dur; S.swirl=swirl; S.stag=stag;
}
function setTier(t){
  S.tier=t; if(S.morph>=.5) S.shapeA=S.shapeB;
  S.morph=0; S.morphing=false; S.ai=0;
  allocate(); generate(bufs[0],S.shapeA);
  ui.tier.value=String(t); slow=0; frames=0; warm=0;
}

/* ------------------------------ behaviour --------------------------------- */
function setObject(name){
  if(name===S.obj && !S.melted) { return; }
  const o=OBJECTS[name];
  S.obj=name; S.melted=false; S.meltPending=false; S.heatTarget=0;
  S.tween={ p0:S.pos.slice(), q0:S.rot.slice(), p1:o.pos, q1:o.rot, t:0, dur:1.4 };
  S.spin=[0,0,0];
  morphTo(o.shape,1.7,.45,.6);
  syncUI();
}
function action(){
  if(S.obj==='bulb'){ S.bulbOn=!S.bulbOn; }
  else if(S.obj==='watch'){ S.lume=!S.lume; }
  else {
    if(!S.melted){                         // heat first, then slump into a pool
      S.melted=true; S.heatTarget=1; S.meltPending=true; S.spin=[0,0,0];
      const yaw=Math.atan2(2*(S.rot[3]*S.rot[1]+S.rot[0]*S.rot[2]),1-2*(S.rot[1]*S.rot[1]+S.rot[0]*S.rot[0]));
      S.tween={ p0:S.pos.slice(), q0:S.rot.slice(), p1:[S.pos[0],0.215,S.pos[2]], q1:qAxis([0,1,0],yaw), t:0, dur:1.1 };
    } else {                               // pour back into the mould and cool
      S.melted=false; S.meltPending=false; S.heatTarget=0;
      morphTo(2,2.6,.03,.8);
    }
  }
  syncUI();
}

/* ------------------------------ UI ---------------------------------------- */
const $=id=>document.getElementById(id);
const ui={ tier:$('tier'), stats:$('stats') };
TIERS.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=fmtM(total(t))+' particles'; ui.tier.appendChild(o); });
function syncUI(){
  document.querySelectorAll('[data-obj]').forEach(b=>b.classList.toggle('on',b.dataset.obj===S.obj));
  for(const k of ['bulb','watch','ingot']) $('act-'+k).hidden=k!==S.obj;
  $('actLbl').textContent=OBJECTS[S.obj].label;
  $('bulbBtn').textContent=S.bulbOn?'Switch off':'Switch on'; $('bulbBtn').classList.toggle('on',S.bulbOn);
  $('lumeBtn').classList.toggle('on',S.lume);
  $('meltBtn').textContent=S.melted?'Cast back into a bar':'Melt it'; $('meltBtn').classList.toggle('on',S.melted);
  $('studio').checked=S.studio; $('photons').checked=S.photons; $('orbit').checked=S.orbit;
}
document.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>setObject(b.dataset.obj));
$('bulbBtn').onclick=$('lumeBtn').onclick=$('meltBtn').onclick=action;
$('syncBtn').onclick=()=>{ S.watchT=Date.now(); S.warp=1; $('warp').value='1'; };
$('warp').onchange=e=>S.warp=+e.target.value;
$('studio').onchange=e=>S.studio=e.target.checked;
$('photons').onchange=e=>S.photons=e.target.checked;
$('orbit').onchange=e=>S.orbit=e.target.checked;
$('langle').oninput=e=>{ S.keyAngle=+e.target.value; S.orbit=false; $('orbit').checked=false; };
$('lcol').oninput=e=>{ const h=e.target.value; S.keyCol=[1,3,5].map(i=>Math.pow(parseInt(h.substr(i,2),16)/255,2.2)); };
ui.tier.onchange=e=>{ $('auto').checked=false; setTier(+e.target.value); };
$('fold').onclick=()=>{ const m=$('panel').classList.toggle('min'); $('fold').textContent=m?'+':'–'; };
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='1') setObject('bulb'); else if(e.key==='2') setObject('watch'); else if(e.key==='3') setObject('ingot');
  else if(e.key===' '){ e.preventDefault(); action(); }
  else if(e.key==='l'||e.key==='L'){ S.studio=!S.studio; syncUI(); }
  else if(e.key==='p'||e.key==='P'){ S.photons=!S.photons; syncUI(); }
});

/* pointer: rotate / move / orbit / zoom / click */
const ptrs=new Map(); let dragMode=null, moved=0, pinch=0, camBasis={x:[1,0,0],y:[0,1,0],z:[0,0,1]};
function worldPerPx(){ const d=Math.hypot(...S.pos.map((v,i)=>v-eye[i])); return 2*d*Math.tan(FOV/2)/canvas.clientHeight; }
let eye=[0,0,6];
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  moved=0; S.userTouched=true; canvas.classList.add('drag');
  if(ptrs.size===1){ dragMode=e.altKey||e.button===1?'orbit':(e.shiftKey||e.button===2?'move':'rotate'); if(dragMode==='rotate') S.spin=[0,0,0]; }
  else { dragMode='pinch'; const p=[...ptrs.values()]; pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); }
});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId), dx=e.clientX-prev[0], dy=e.clientY-prev[1];
  ptrs.set(e.pointerId,[e.clientX,e.clientY]); moved+=Math.abs(dx)+Math.abs(dy);
  if(dragMode==='rotate'){
    const k=0.0075;
    S.rot=qNorm(qMul(qMul(qAxis([0,1,0],dx*k),qAxis(camBasis.x,dy*k)),S.rot));
    S.spin=[camBasis.x[0]*dy*k*40, dx*k*40+camBasis.x[1]*dy*k*40, camBasis.x[2]*dy*k*40];
    S.tween=null;
  } else if(dragMode==='move'){
    movePx(dx,dy);
  } else if(dragMode==='orbit'){
    S.cam.yaw-=dx*0.006; S.cam.pitch=Math.max(0.03,Math.min(1.45,S.cam.pitch+dy*0.006));
  } else if(dragMode==='pinch' && ptrs.size>=2){
    const p=[...ptrs.values()], d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    S.cam.dist=Math.max(2.4,Math.min(14,S.cam.dist*pinch/Math.max(d,1))); pinch=d;
    movePx(dx/2,dy/2);
  }
});
function movePx(dx,dy){
  const s=worldPerPx(); S.tween=null;
  for(let i=0;i<3;i++) S.pos[i]+=camBasis.x[i]*dx*s-camBasis.y[i]*dy*s;
  S.pos[0]=Math.max(-3.5,Math.min(3.5,S.pos[0])); S.pos[2]=Math.max(-3.5,Math.min(3.5,S.pos[2]));
  S.pos[1]=Math.max(0.15,Math.min(3.4,S.pos[1]));
}
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    canvas.classList.remove('drag');
    if(moved<5 && dragMode==='rotate' && hitObject(e.clientX,e.clientY)) action();
    if(moved<5) S.spin=[0,0,0];
    dragMode=null;
  } else dragMode='rotate';
}
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); S.cam.dist=Math.max(2.4,Math.min(14,S.cam.dist*Math.exp(e.deltaY*0.0012))); },{passive:false});
canvas.addEventListener('dblclick',()=>{ const o=OBJECTS[S.obj]; S.tween={p0:S.pos.slice(),q0:S.rot.slice(),p1:o.pos,q1:o.rot,t:0,dur:.9}; S.spin=[0,0,0]; });
let lastVP=null;
function hitObject(cx,cy){
  if(!lastVP) return true;
  const p=S.pos, m=lastVP, w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
  const x=(m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12])/w, y=(m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13])/w;
  const sx=(x*.5+.5)*canvas.clientWidth, sy=(1-(y*.5+.5))*canvas.clientHeight;
  const r=SHAPES[S.shapeA].br*1.05/worldPerPx();
  return Math.hypot(cx-sx,cy-sy)<r;
}

/* ------------------------------ frame loop -------------------------------- */
let last=performance.now(), fps=60, frames=0, slow=0, warm=0, statT=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.1); last=now; S.time+=dt;
  resize();

  // --- state ---
  if(S.morphing){ S.morph+=dt/S.morphDur; if(S.morph>=1){ S.morph=0; S.morphing=false; S.ai=1-S.ai; S.shapeA=S.shapeB; } }
  if(S.tween){ const t=S.tween; t.t=Math.min(1,t.t+dt/t.dur); const e=t.t*t.t*(3-2*t.t);
    S.pos=t.p0.map((v,i)=>v+(t.p1[i]-v)*e); S.rot=qLerp(t.q0,t.q1,e); if(t.t>=1) S.tween=null; }
  else if(dragMode!=='rotate'){
    const w=Math.hypot(...S.spin);
    if(w>1e-4){ S.rot=qNorm(qMul(qAxis(S.spin.map(v=>v/w),w*dt),S.rot)); if(S.userTouched){ const k=Math.exp(-dt*2.2); S.spin=S.spin.map(v=>v*k); } }
  }
  S.bulbLevel+=((S.bulbOn?1:0)-S.bulbLevel)*(1-Math.exp(-dt*(S.bulbOn?9:5)));
  S.lumeLevel+=((S.lume?1:0)-S.lumeLevel)*(1-Math.exp(-dt*4));
  S.studioLevel+=((S.studio?1:0)-S.studioLevel)*(1-Math.exp(-dt*5));
  S.heat+=(S.heatTarget-S.heat)*(1-Math.exp(-dt*(S.heatTarget>S.heat?1.5:0.22)));
  if(S.meltPending && S.heat>0.72 && !S.tween){ S.meltPending=false; morphTo(3,3.4,.02,.85); }
  if(S.orbit){ S.keyAngle=(S.keyAngle+dt*0.22)%(Math.PI*2); $('langle').value=S.keyAngle; }
  S.watchT+=dt*1000*S.warp;

  // --- camera ---
  const c=S.cam;
  const tgt=[S.pos[0]*.6, Math.max(S.pos[1],.5)*.72+.15, S.pos[2]*.6];
  for(let i=0;i<3;i++) c.target[i]+=(tgt[i]-c.target[i])*(1-Math.exp(-dt*3));
  eye=[c.target[0]+c.dist*Math.sin(c.yaw)*Math.cos(c.pitch), c.target[1]+c.dist*Math.sin(c.pitch), c.target[2]+c.dist*Math.cos(c.yaw)*Math.cos(c.pitch)];
  const view=lookAt(eye,c.target); camBasis=view;
  const VP=mul4(perspective(FOV,W/H,0.1,60),view.m); lastVP=VP;
  const projScale=H/(2*Math.tan(FOV/2));

  // --- lights (object-local space) ---
  const R=qMat3(S.rot);
  const st=S.studioLevel;
  const keyW=[3.3*Math.cos(S.keyAngle),3.5,3.3*Math.sin(S.keyAngle)], fillW=[-3.4,1.7,2.3];
  const d=+$('dimmer').value;
  let l3p=[0,0,0], l3c=[0,0,0], l3r=.2, emit=[0,0,0], emitAlb=[.3,.28,.26,1], glow=[0,0,0], phScale=[.17,.055,.055];
  let haloFrac=0, haloSize=.3, haloGain=0;
  if(S.obj==='bulb'){
    const b=S.bulbLevel*d, warm=[1,.6+.12*d,.26+.2*d*d];
    l3p=[0,.42,0]; l3c=warm.map(v=>v*17*b); emit=warm.map(v=>v*60*b); glow=warm.map(v=>v*.13*b);
    haloFrac=Math.min(1,18000/N); haloSize=.42; haloGain=.00012;
  } else if(S.obj==='watch'){
    emit=[.25,1,.72].map(v=>v*1.7*S.lumeLevel); emitAlb=[.82,.86,.8,0];
    haloFrac=Math.min(1,26000/N); haloSize=.11; haloGain=.012;
  } else {
    const h=S.heat*S.heat;
    l3p=[0,.15,0]; l3c=[1,.34,.07].map(v=>v*11*h); l3r=1.25; phScale=[1.45,.6,.9];
    haloFrac=Math.min(1,700/N); haloSize=.75; haloGain=.00003;
  }
  const lpos=[...toLocal(R,S.pos,keyW),...toLocal(R,S.pos,fillW),...l3p];
  const lcol=[...S.keyCol.map(v=>v*46*st), .32*13*st,.52*13*st,1*13*st, ...l3c];
  const camL=toLocal(R,S.pos,eye);
  const floorN=[R[1],R[4],R[7]];
  const A=SHAPES[S.shapeA], B=SHAPES[S.shapeB];
  const bc=S.morph>0?[0,0,0]:A.bc, br=S.morph>0?Math.max(A.br+Math.hypot(...A.bc),B.br+Math.hypot(...B.bc)):A.br;
  const dte=new Date(S.watchT), sec=dte.getSeconds()+dte.getMilliseconds()/1000;
  const tick=Math.abs(S.warp)===1 ? Math.floor(sec)+Math.min(1,(sec%1)*9) : sec;
  const mins=dte.getMinutes()+sec/60, hrs=(dte.getHours()%12)+mins/60;
  const hands=[hrs/12*Math.PI*2, mins/60*Math.PI*2, tick/60*Math.PI*2];

  const lum=v=>Math.max(v[0],v[1],v[2]);
  let w0=lum(lcol.slice(0,3)), w1=lum(lcol.slice(3,6))*1.6, w2=lum(l3c)*2.2;
  let ws=w0+w1+w2, phW=[0,0,0];
  if(S.photons && ws>0.05){ phW=[w0/ws,(w0+w1)/ws,1]; }

  function common(P){
    gl.useProgram(P.p);
    gl.uniform1i(P.u('uShapeA'),S.shapeA); gl.uniform1i(P.u('uShapeB'),S.shapeB); gl.uniform1i(P.u('uZero'),0);
    gl.uniform1f(P.u('uMorph'),S.morph); gl.uniform3fv(P.u('uHands'),hands);
    gl.uniform3fv(P.u('uCam'),camL); gl.uniform3fv(P.u('uLPos'),lpos); gl.uniform3fv(P.u('uLCol'),lcol);
    gl.uniform1fv(P.u('uLRad'),[0,0,l3r]);
    gl.uniform4f(P.u('uFloor'),floorN[0],floorN[1],floorN[2],S.pos[1]);
    gl.uniformMatrix3fv(P.u('uRot'),false,R); gl.uniform3fv(P.u('uPos'),S.pos);
    gl.uniform1f(P.u('uEnvI'),0.03+0.97*st); gl.uniform1f(P.u('uBR'),br); gl.uniform3fv(P.u('uBC'),bc);
    gl.uniform1f(P.u('uTime'),S.time); gl.uniform1f(P.u('uHeat'),S.obj==='ingot'?S.heat:0);
    gl.uniform3fv(P.u('uEmit'),emit); gl.uniform4fv(P.u('uEmitAlb'),emitAlb);
    gl.uniformMatrix4fv(P.u('uVP'),false,VP); gl.uniform1i(P.u('uLDR'),hdrOK?0:1);
  }

  // --- draw ---
  gl.bindFramebuffer(gl.FRAMEBUFFER,hdrOK?fbo:null);
  gl.viewport(0,0,W,H); gl.clearColor(0,0,0,1); gl.clearDepth(1);
  gl.depthMask(true); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);

  const tier=TIERS[S.tier];
  common(progObj);
  const area=S.morph>0?Math.max(A.area,B.area):A.area;
  gl.uniform1f(progObj.u('uPx'),2.0*Math.sqrt(area/N)*projScale);
  gl.uniform1f(progObj.u('uSwirl'),S.swirl); gl.uniform1f(progObj.u('uStag'),S.stag);
  gl.uniform1f(progObj.u('uHaloFrac'),haloFrac); gl.uniform1f(progObj.u('uHaloPx'),haloSize*projScale); gl.uniform1f(progObj.u('uHaloGain'),haloGain*Math.max(1,N*haloFrac/700)**-1*26);
  gl.uniform3fv(progObj.u('uGlassGlow'),glow);
  gl.bindVertexArray(vaos[S.ai]);
  gl.uniform1i(progObj.u('uPass'),0); gl.drawArrays(gl.POINTS,0,N);

  gl.bindVertexArray(null);
  common(progFloor);
  gl.uniform1f(progFloor.u('uFloorR'),6.5);
  gl.uniform1f(progFloor.u('uPx'),3.4*Math.sqrt(133/tier.f)*projScale);
  gl.drawArrays(gl.POINTS,0,tier.f);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
  gl.useProgram(progObj.p); gl.bindVertexArray(vaos[S.ai]);
  gl.uniform1i(progObj.u('uPass'),1); gl.drawArrays(gl.POINTS,0,N);
  if(lum(emit)>1e-3 || (S.obj==='ingot'&&S.heat>0.02)){ gl.uniform1i(progObj.u('uPass'),2); gl.drawArrays(gl.POINTS,0,N); }
  gl.bindVertexArray(null);
  if(phW[2]>0){
    common(progPhoton);
    gl.uniform3fv(progPhoton.u('uPhW'),phW); gl.uniform3fv(progPhoton.u('uPhScale'),phScale);
    gl.uniform1f(progPhoton.u('uPhSpeed'),1.5); gl.uniform1f(progPhoton.u('uPhGain'),0.085*Math.sqrt(180e3/tier.p));
    gl.uniform1f(progPhoton.u('uPx'),0.0048*projScale*Math.pow(180e3/tier.p,.15));
    gl.drawArrays(gl.POINTS,0,tier.p);
  }
  gl.depthMask(true); gl.disable(gl.BLEND);

  if(hdrOK){
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.disable(gl.DEPTH_TEST);
    gl.useProgram(progBlit.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,fboTex); gl.uniform1i(progBlit.u('uTex'),0);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  // --- stats and adaptive particle budget ---
  fps+=(1/Math.max(dt,1e-4)-fps)*0.06; warm+=dt; statT+=dt;
  if(statT>0.4){ statT=0; ui.stats.textContent=fmtM(total(tier))+' particles · '+Math.round(fps)+' fps';
    if(S.obj==='watch') $('clock').textContent=dte.toLocaleTimeString(); }
  if($('auto').checked && warm>2.5 && !S.morphing){
    slow=fps<42?slow+dt:Math.max(0,slow-dt*2);
    if(slow>2.2 && S.tier>0) setTier(S.tier-1);
  }
  window.__frames=++frames;
  requestAnimationFrame(frame);
}

/* ------------------------------ go ---------------------------------------- */
resize(); allocate();
if(qs.has('obj') && OBJECTS[qs.get('obj')]){ const o=OBJECTS[qs.get('obj')]; S.obj=qs.get('obj'); S.pos=o.pos.slice(); S.rot=o.rot.slice(); }
S.shapeA=S.shapeB=OBJECTS[S.obj].shape;
if(S.obj!=='bulb') S.spin=[0,0.25,0];
generate(bufs[0],S.shapeA);
ui.tier.value=String(S.tier); syncUI();
addEventListener('resize',resize);
window.__S=S; window.__action=action; window.__setObject=setObject;
requestAnimationFrame(frame);
</script>
</body>
</html>
